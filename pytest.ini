[pytest]
addopts = --doctest-modules --durations=20
testpaths = ccp
# Used only when pytest-django is installed (the web extra); the ccp_web
# tests run with: uv run pytest ccp_web/tests
DJANGO_SETTINGS_MODULE = ccp_web.settings.test
markers =
    slow: dominated by full compressor calculations (deselect with '-m "not slow"')
