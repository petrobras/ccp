name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run, so a broken REFPROP deploy key or a new dependency release that
  # breaks the tests is caught even when nothing is merged. Fork PRs skip the
  # REFPROP job, and dependencies are not locked in CI (uv.lock is not tracked).
  schedule:
    - cron: "17 6 * * 1" # Mondays at 06:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # REFPROP is proprietary (NIST license), so the compiled library lives in a
  # private repository and is fetched with a read-only deploy key stored as
  # the REFPROP_DEPLOY_KEY secret. Secrets are never exposed to workflows
  # triggered by pull requests from forks, so the test job is skipped there:
  # forks need their own private REFPROP repository and secret to run CI.
  # Do NOT convert the pull_request trigger to pull_request_target - that
  # would expose the secret to arbitrary code from fork PRs.
  check-secret:
    name: Check REFPROP secret
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.REFPROP_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests (REFPROP)
    needs: check-secret
    if: needs.check-secret.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RPPREFIX: ${{ github.workspace }}/refprop
    steps:
      - uses: actions/checkout@v4

      - name: Fetch REFPROP (private repository)
        uses: actions/checkout@v4
        with:
          repository: raphaeltimbo/refprop-linux
          ssh-key: ${{ secrets.REFPROP_DEPLOY_KEY }}
          path: refprop

      # libgfortran5 is needed by REFPROP, tesseract-ocr by the digitizer tests
      # (they are skipped when the binary is missing).
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libgfortran5 tesseract-ocr

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check REFPROP is loaded
        run: |
          uv run python -c "
          import ccp
          assert ccp.REFPROP_AVAILABLE, 'librefprop.so not found at RPPREFIX'
          print(ccp.__version__full)
          "

      - name: Run tests
        run: uv run pytest ccp/tests -n 4 --dist loadfile

      - name: Run web app tests (desktop profile)
        run: uv run pytest ccp_web/tests

      - name: Run web app tests (hosted profile)
        env:
          CCP_TEST_MULTI_USER: "1"
        run: uv run pytest ccp_web/tests

  # Build the distributions as the release does and install the wheel, with
  # the web extra, into a clean environment: catches files left out of the
  # package (templates, static files, migrations) and undeclared dependencies.
  # Needs no REFPROP, so it also runs on pull requests from forks.
  package:
    name: Package (wheel + web extra, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python the web extra supports.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist and wheel
        run: uv build --out-dir dist/

      - name: Check the distributions
        run: python3 .github/scripts/check_dist.py dist/

      - name: Install the wheel with the web extra
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$(ls dist/*.whl)[web]"

      - name: Run the web app from the installed wheel
        working-directory: ${{ runner.temp }}
        env:
          CCP_DATA_DIR: ${{ runner.temp }}/ccp-data
        run: |
          source venv/bin/activate
          ccp-web --help
          ccp-web manage check
          ccp-web manage migrate
          ccp-web manage makemigrations --check --dry-run
          ccp-web serve --port 8765 --no-browser --no-workers --no-agent &
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:8765/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8765/
          curl -sf -o /dev/null http://127.0.0.1:8765/static/ccp_web/css/app.css
          kill $!
