[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccp-performance"
dynamic = ["version"]
description = "Centrifugal Compressor Performance calculation."
readme = "README.md"
authors = [
    {name = "Raphael Timbó", email = "raphaelts@petrobras.com.br"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas>=0.23",
    "pyarrow",
    "CoolProp",
    "pint>=0.18",
    "plotly>=4.7.0",
    "toml>=0.10.1",
    "openpyxl",
    "tqdm",
    "ctREFPROP",
    "xlsxwriter",
    "scikit-learn",
    "xlwings; sys_platform == 'win32' or sys_platform == 'cygwin' or sys_platform == 'msys'",
    "google-generativeai>=0.8.6",
    "markdown>=3.9",
]

[project.urls]
Documentation = "https://ccp-centrifugal-compressor-performance.readthedocs.io/en/stable/"
"Bug Tracker" = "https://github.com/petrobras/ccp/issues"
"Source Code" = "https://github.com/petrobras/ccp"

[project.scripts]
ccp-app = "ccp.app.cli:main"
ccp-web = "ccp_web.cli:main"
ccp-install-skill = "ccp.agent_skills.install:main"

[project.optional-dependencies]
app = [
    "streamlit>=1.21.0",
    "sentry-sdk",
]
web = [
    "django>=5.2,<5.3; python_version >= '3.10'",
    "django-htmx>=1.23; python_version >= '3.10'",
    "django-template-partials>=24.4; python_version >= '3.10'",
    "django-tasks>=0.12; python_version >= '3.10'",
    "django-tasks-db[compat]>=0.13; python_version >= '3.10'",
    "django-allauth>=65.0; python_version >= '3.10'",
    "platformdirs>=4.0; python_version >= '3.10'",
    "keyring>=25.0; python_version >= '3.10'",
    "whitenoise>=6.7; python_version >= '3.10'",
    "waitress>=3.0; python_version >= '3.10'",
]
desktop = [
    "ccp-performance[web]",
    "pywebview>=5.0; python_version >= '3.10'",
]
hosted = [
    "ccp-performance[web]",
    "gunicorn>=23.0; python_version >= '3.10'",
    "psycopg[binary]>=3.2; python_version >= '3.10'",
]
# ccp.digitize: reading performance curves from vendor PDFs.
# Also needs the Tesseract OCR binary (https://github.com/tesseract-ocr/tesseract).
digitize = [
    "pypdfium2>=5",
    "scikit-image>=0.20",
    "pytesseract>=0.3.10",
    "pillow",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "ccp.__version__"}

[tool.setuptools.packages.find]
include = ["ccp*"]

[tool.setuptools.package-data]
"ccp.agent_skills" = ["ccp/*.md"]
"ccp.config" = ["new_units.txt", "legacy_water_units.txt"]
"ccp.tests" = ["*.py"]
"ccp.tests.data" = ["*"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "coverage",
    "codecov",
    "sphinx",
    "nbsphinx",
    "numpydoc",
    "sphinxcontrib-bibtex",
    "ruff",
    "myst-nb",
    "linkify-it-py",
    "sphinx-book-theme",
    "sphinx-panels",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
    "sphinx-design",
    "sphinxcontrib-googleanalytics",
    "pytest-xdist>=3.8.0",
    "pytest-django>=4.9; python_version >= '3.10'",
    "django-tailwind>=4.4; python_version >= '3.11'",
]

[tool.uv]
package = true
